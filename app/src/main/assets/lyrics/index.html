<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="amll.css">
<link rel="stylesheet" href="lyrics.css">
<script>
  // 脚本错误交给原生显示，不要只留一片空白
  (function () {
    var report = function (message) {
      try { window.FantasticBridge && FantasticBridge.status('error:' + message); } catch (e) {}
    };
    window.addEventListener('error', function (e) {
      report((e.message || '脚本错误') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      report(String(e.reason && (e.reason.stack || e.reason.message) || e.reason));
    });
    window.__moduleFailed = function () { report('lyrics.mjs 加载失败'); };
  })();
</script>
<script type="module" src="lyrics.mjs" onerror="__moduleFailed()"></script>
</head>
<body>
<div id="lyrics"></div>
</body>
</html>
